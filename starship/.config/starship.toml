# Based on the official Starship "nerd-font-symbols" preset — flat text + Nerd
# Font icons, no powerline. Trimmed to directory + git; other modules are left
# out of `format`, so Starship never evaluates them (no node/aws forks) — fast.
# Only ever renders outside Warp (see ~/.zshrc gate; Warp uses its native prompt).
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
format = "$directory$git_branch$git_state$git_status$git_metrics$line_break$character"

[directory]
read_only = " 󰌾"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold yellow"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold"
conflicted = "[⚔${count}](bold red) "
ahead      = "[⇡${count}](bold green) "
behind     = "[⇣${count}](bold red) "
diverged   = "[⇡${ahead_count}⇣${behind_count}](bold yellow) "
untracked  = "[?${count}](bold blue) "
modified   = "[!${count}](bold yellow) "
staged     = "[+${count}](bold green) "
renamed    = "[»${count}](bold cyan) "
deleted    = "[✘${count}](bold red) "

[git_metrics]
disabled = false
added_style = "bold green"
deleted_style = "bold red"
format = '[+$added]($added_style) [-$deleted]($deleted_style) '

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
