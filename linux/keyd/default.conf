# Caps Lock as a Hyper key, matching macOS Hyperkey.app.
#
# Holding Caps Lock emits ctrl+alt+shift+super. herdr treats `cmd`, `command`
# and `super` as the same modifier token, so the ctrl+alt+shift+cmd+* bindings
# in herdr/.config/herdr/config.toml work unchanged on Linux.
#
# keyd modifier letters: C=control, A=alt, S=shift, M=meta/super, G=altgr.
#
# Hyprland matches an exact modifier mask, so its plain SUPER binds do not
# fire on hyper chords. The terminal must speak the kitty keyboard protocol
# (kitty and Ghostty both do) for four-modifier chords to reach herdr.

[ids]

*

[main]

capslock = layer(hyper)

[hyper:C-A-S-M]
