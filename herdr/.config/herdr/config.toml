onboarding = false
[ui]
agent_panel_sort = "spaces"
sidebar_min_width = 40
sidebar_max_width = 90

show_agent_labels_on_pane_borders = false
[keys]
prefix = "ctrl+alt+shift+cmd+a"
switch_workspace = "ctrl+alt+shift+cmd+1..9"
focus_pane_left = "ctrl+alt+shift+cmd+h"
focus_pane_down = "ctrl+alt+shift+cmd+j"
focus_pane_up = "ctrl+alt+shift+cmd+k"
focus_pane_right = "ctrl+alt+shift+cmd+l"
last_pane = "ctrl+alt+shift+cmd+tab"
split_vertical = "ctrl+alt+shift+cmd+d"
split_horizontal = "ctrl+alt+shift+cmd+v"
zoom = "ctrl+alt+shift+cmd+z"
close_pane = "ctrl+alt+shift+cmd+x"
new_tab = "ctrl+alt+shift+cmd+t"
next_tab = "ctrl+alt+shift+cmd+n"
previous_tab = "ctrl+alt+shift+cmd+p"
workspace_picker = "ctrl+alt+shift+cmd+w"
goto = "ctrl+alt+shift+cmd+g"
open_notification_target = "ctrl+alt+shift+cmd+o"
toggle_sidebar = "ctrl+alt+shift+cmd+b"
previous_agent = "ctrl+alt+shift+cmd+comma"
next_agent = "ctrl+alt+shift+cmd+period"
new_workspace = "ctrl+alt+shift+cmd+s"
new_worktree = "ctrl+alt+shift+cmd+f"
open_worktree = "ctrl+alt+shift+cmd+e"
remove_worktree = "ctrl+alt+shift+cmd+r"

[ui.sound]
enabled = false

[ui.toast]
delivery = "terminal"

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true

# Give claude agents a dedicated activity line in the sidebar.
# Row 2 = Claude's own terminal title; row 3 = live file activity set by the
# herdr-title.sh PostToolUse hook via report-metadata --display-agent.
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

# Show branch + dirty state per space — worktree-heavy GSD flow.
[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]
